# Segredos do billing: senha do usuario da aplicacao (billing_app), token de
# acesso e segredo de assinatura do webhook do Mercado Pago. Vem dos secrets do
# repositorio (BILLING_DB_APP_PASSWORD, MP_ACCESS_TOKEN, MP_WEBHOOK_SECRET),
# aplicados pelo pipeline via envsubst; nenhum valor fica versionado.
apiVersion: v1
kind: Secret
metadata:
  name: mechanical-hub-billing-secrets
  namespace: production
  labels:
    app: mechanical-hub-billing
    app.kubernetes.io/name: billing

type: Opaque
stringData:
  database-password: "${DB_PASSWORD}"
  mp-access-token: "${MP_ACCESS_TOKEN}"
  mp-webhook-secret: "${MP_WEBHOOK_SECRET}"
