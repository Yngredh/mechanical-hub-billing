# Configuracao do agente Java do OpenTelemetry (-Dotel.javaagent.configuration-file).
# Endpoint do coletor e ambiente vem das variaveis do ConfigMap
# (OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_RESOURCE_ATTRIBUTES), que tem precedencia.
otel.service.name=mechanical-hub-billing
otel.traces.exporter=otlp
otel.metrics.exporter=none
otel.logs.exporter=none
otel.exporter.otlp.protocol=http/protobuf
otel.propagators=tracecontext,baggage

# Propaga o contexto de trace nos message attributes do SQS (envio e consumo),
# ligando o trace do billing ao do orquestrador. O SqsOutboxMessageSender ja envia
# `traceparent`; atributos SQS sao um mapa por nome, entao o agente so sobrescreve a mesma chave. Ocupa ate 2 dos 10 atributos.
otel.instrumentation.aws-sdk.experimental-use-propagator-for-messaging=true

# trace_id/span_id no MDC do Logback (campos do log JSON).
otel.instrumentation.logback-mdc.enabled=true
