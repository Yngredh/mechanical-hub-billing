spring:
  application:
    name: mechanical-hub-billing
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/billing}
    username: ${DB_USER:billing}
    password: ${DB_PASSWORD:secret}
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      sqs:
        endpoint: ${AWS_SQS_ENDPOINT:}

billing:
  queues:
    commands: ${BILLING_COMMANDS_QUEUE_URL:mechanical-hub-billing-commands.fifo}
    commands-dlq: ${BILLING_COMMANDS_DLQ_URL:mechanical-hub-billing-commands-dlq.fifo}
    events: ${ORCHESTRATOR_EVENTS_QUEUE_URL:mechanical-hub-orchestrator-events.fifo}

mercado-pago:
  base-url: ${MP_BASE_URL:https://api.mercadopago.com}
  access-token: ${MP_ACCESS_TOKEN:}
  webhook-secret: ${MP_WEBHOOK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
